<p class="eyebrow">Control status</p>
<p id="status">Control unavailable</p>
<p id="status-detail" hidden></p>
<div id="release-gesture" class="release-gesture" hidden>
  <svg class="release-ring" viewBox="0 0 40 40" aria-hidden="true">
    <circle class="release-track" cx="20" cy="20" r="16"/>
    <circle id="release-fill" class="release-fill" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
  </svg>
  <span id="release-countdown" role="progressbar" aria-label="Hold to release arm torque" aria-valuemin="0" aria-valuemax="100"></span>
</div>
